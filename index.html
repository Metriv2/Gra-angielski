<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akademia Angielskiego</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
    body { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    .kid-card { transition: transform 0.14s ease, box-shadow 0.14s ease; }
    .kid-card:active { transform: scale(0.96); }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    .float-anim { animation: floatAnim 3s ease-in-out infinite; }
    @keyframes popCorrect { 0% { transform: scale(0.9); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .pop-correct { animation: popCorrect 0.32s ease-out forwards; }
    @keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
    .shake-wrong { animation: shakeWrong 0.35s ease-in-out; }
    @keyframes dragonAttackShake { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-10px, -4px) scale(1.08); } 50% { transform: translate(10px, 4px) scale(1.12); } 75% { transform: translate(-6px, 2px) scale(1.05); } }
    .dragon-hit-anim { animation: dragonAttackShake 0.45s ease-in-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-100 via-indigo-50 to-amber-50 min-h-screen text-slate-800 flex flex-col">

  <!-- GÓRNY PASEK NAWIGACJI I STATYSTYK -->
  <header id="appHeader" class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b-4 border-sky-300 shadow-sm px-3 py-2">
    <!-- Renderowane dynamicznie przez js/09-main-ui.js -->
  </header>

  <!-- GŁÓWNY OBSZAR GRY -->
  <main id="mainContainer" class="flex-1 max-w-5xl w-full mx-auto p-3 md:p-5 flex flex-col justify-center">
    <div class="text-center py-12 font-extrabold text-sky-800 text-lg animate-pulse">
      🦉 Ładowanie Akademii Angielskiego...
    </div>
  </main>

  <!-- STOPKA Z CENTRALNĄ WERSJĄ -->
  <footer class="text-center py-2.5 text-xs text-slate-500 font-bold border-t border-slate-200 bg-white/70">
    <span>🦉 Akademia Angielskiego • </span>
    <span data-app-version class="text-sky-700 font-extrabold"></span>
    <button onclick="openWhatsNewModal(true)" class="ml-2 underline text-indigo-600 hover:text-indigo-800">Co nowego?</button>
  </footer>

  <!-- WARSTWA OKIEN MODALNYCH (SKRZYNIE, GARDEROBA, PANEL RODZICA, CO NOWEGO) -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
    <div id="modalContent" class="w-full max-w-2xl my-auto"></div>
  </div>

  <!-- MODUŁY APLIKACJI (KOLEJNOŚĆ MA ZNACZENIE) -->
  <script src="js/01-config.js"></script>
  <script src="js/02-state-cloud.js"></script>
  <script src="js/03-lessons-data.js"></script>
  <script src="js/04-audio-speech.js"></script>
  <script src="js/05-avatar-wardrobe.js"></script>
  <script src="js/06-games-core.js"></script>
  <script src="js/07-games-special.js"></script>
  <script src="js/08-parent-panel.js"></script>
  <script src="js/09-main-ui.js"></script>
</body>
</html>
